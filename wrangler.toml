# Configuracion del proyecto de Cloudflare Pages.
#
# Desde que este archivo existe, EL ARCHIVO MANDA: los enlaces y las variables de
# ejecucion que se vean en el panel de Cloudflare quedan de solo lectura. Lo que se
# quiera cambiar se cambia aca y se publica con un push. Ver ADR-012.
#
# Lo que NO se configura aca, porque pertenece al sistema de construccion y sigue
# viviendo en el panel: la orden de construccion (`npm run build`) y la variable
# NODE_VERSION. El directorio de salida si se declara aca, en
# pages_build_output_dir, y ese valor manda sobre el del panel.

name = "examen-certificacion-td-js"
compatibility_date = "2026-09-03"
pages_build_output_dir = "dist"

# Base de datos del banco de preguntas.
#
# El nombre del enlace, BANCO, es el que ve el codigo de functions/ como
# `env.BANCO`. Cambiarlo obliga a cambiar tambien functions/api/_comun.js.
#
# El identificador de abajo NO es una credencial: sin un token de la cuenta no
# abre nada. Se versiona a proposito, y esa excepcion esta acotada por escrito en
# ADR-012, que modifico la regla de CLAUDE.md para permitir exactamente esto y
# nada mas. Un token de API jamas se escribe en este archivo.
[[d1_databases]]
binding = "BANCO"
database_name = "examen-td-js-produccion"
database_id = "cff1686b-3b24-4892-9a10-4306684e0127"

# Nombre del entorno. Existe para que la respuesta de /api/estado pueda decir
# contra que base esta hablando, y asi el error caro —creer que se mira pruebas
# cuando se mira produccion— tenga que ser deliberado en vez de posible.
[vars]
ENTORNO = "produccion"

# Base de pruebas, para los despliegues de vista previa.
#
# El bloque de arriba, sin prefijo de entorno, rige para produccion y para el
# desarrollo local; este rige solo para las vistas previas. Es lo que impide que
# una rama en construccion lea la base real.
#
# El nombre del enlace es el mismo, BANCO, a proposito: el codigo de functions/ no
# sabe contra que entorno esta corriendo, y no tiene por que saberlo. Lo que cambia
# es a que base apunta ese nombre.
#
# Cuidado si algun dia se agrega un enlace nuevo (otra base, una cola, un almacen):
# los enlaces NO se heredan por entorno. En cuanto un entorno declara uno, tiene que
# declararlos todos, o los que falten dejan de existir para ese entorno.
[[env.preview.d1_databases]]
binding = "BANCO"
database_name = "examen-td-js-pruebas"
database_id = "c01df3c9-c2a1-4379-ab2e-249e933cece4"

# Las variables tampoco se heredan entre entornos. Si este bloque faltara, las
# vistas previas se quedarian sin ENTORNO y /api/estado no sabria decir donde esta.
[env.preview.vars]
ENTORNO = "pruebas"
